[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "material-core"
version = "0.1.0"
description = "Deterministic, bounded processing of explicitly supplied material"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
packages = ["material_core"]
package-dir = {material_core = "."}
