[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devnet-control-plane"
version = "0.1.0"
description = "Autonomous Development Network Control Plane and Interaction Frame Lab"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Development Network Operator"}
]
keywords = [
    "control-plane",
    "development-network",
    "interaction-frames",
    "conversation-fabric",
    "agent-lifecycle"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.optional-dependencies]
mcp = [
    "mcp>=1.30,<2",
]
llm = [
    "openai>=1.0.0",
]
conversation-hub = [
    "conversation-hub @ git+https://github.com/vvaynethomas/conversation-hub.git@2e00f9861ea60b083aaf7d0be779bcef1e23d7c2 ; python_version >= '3.12'",
]

[project.scripts]
devnet = "control_plane.cli:main"
devnet-control-plane = "control_plane.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["control_plane*"]

[tool.setuptools.package-data]
control_plane = ["registry/*.json"]

[tool.setuptools.data-files]
"devnet_registry" = ["registry/interaction_frames.json"]
